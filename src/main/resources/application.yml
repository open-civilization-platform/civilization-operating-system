civilization:
  scale: ${CIVILIZATION_SCALE:LOCAL}

spring:
  application:
    name: civilization-os

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  datasource:
    url: jdbc:postgresql://localhost:5432/openciv
    username: postgres
    password: postgres

  flyway:
    enabled: true
    out-of-order: true

  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
    consumer:
      group-id: civos-core
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    enabled: true

server:
  port: ${PORT:8080}

game:
  events:
    enabled: true
    tick-rate-ms: 30000
  trade:
    max-active: 10
    auto-resolve-days: 7
  cortex:
    engine:
      tick-rate-ms: ${CORTEX_TICK_RATE_MS:30000}

civos:
  eventbus:
    type: ${CIVOS_EVENTBUS_TYPE:spring}
  worker:
    remote-url: ${CIVOS_WORKER_URL:}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

jwt:
  secret: ${JWT_SECRET:civos-dev-secret-key-change-in-production-123456}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
